<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Жеке шақыру сілтемесі</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Montserrat:wght@400;600;700&display=swap">
<style>
:root{--ink:#071712;--em:#0B2A22;--gold:#D4AF6A;--hi:#F6E3B0;--cream:#F3EAD7;--muted:#A9BDB3;--line:rgba(212,175,106,.35);color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--ink);color:var(--cream);font-family:'Montserrat',Arial,sans-serif;display:grid;place-items:center;
  padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.card{width:100%;max-width:520px;background:var(--em);border:1px solid var(--line);border-radius:24px;padding:32px 24px;display:flex;flex-direction:column;gap:18px}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:32px;margin:0;line-height:1.15}
p{margin:0;color:var(--muted);line-height:1.6}
label{font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
input{width:100%;font:inherit;font-size:16px;color:var(--cream);background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,175,106,.15)}
.out{word-break:break-all;font-size:14px;padding:14px;border-radius:14px;background:rgba(0,0,0,.25);border:1px dashed var(--line);color:var(--hi)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{flex:1;min-width:140px;min-height:50px;border:0;border-radius:999px;cursor:pointer;font:inherit;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;color:#1D1406;background:linear-gradient(115deg,#9A7638,#E9CF8E 30%,#FFF4CF 45%,#D4AF6A 62%,#9A7638)}
.btn.g{color:var(--hi);background:rgba(212,175,106,.08);box-shadow:inset 0 0 0 1px var(--gold)}
#qr{align-self:center;background:#fff;padding:12px;border-radius:12px}
.hint{font-size:13px}
</style>
</head>
<body>
<main class="card">
  <h1>Жеке шақыру сілтемесі</h1>
  <p>Қонақтың атын жазыңыз — сайт оны «Құрметті …!» деп қарсы алады. Дайын сілтемені WhatsApp арқылы жіберіңіз.</p>
  <label for="nm">Қонақтың аты</label>
  <input id="nm" type="text" placeholder="Мысалы: Асан аға" autocomplete="off">
  <div class="out" id="out">—</div>
  <div class="row">
    <button class="btn g" id="copy" type="button">Көшіру</button>
    <a class="btn" id="wa" target="_blank" rel="noopener">WhatsApp-қа жіберу</a>
  </div>
  <div id="qr" hidden></div>
  <p class="hint" id="msg" role="status"></p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// Адрес основной страницы приглашения (замени на свой домен после деплоя)
const SITE = location.href.replace(/link\.html.*$/, '');
const nm = document.getElementById('nm'), out = document.getElementById('out'), wa = document.getElementById('wa'), qrEl = document.getElementById('qr'), msg = document.getElementById('msg');
let qr = null;
function build(){
  const n = nm.value.trim();
  const url = n ? SITE + '?q=' + encodeURIComponent(n) : SITE;
  out.textContent = url;
  const text = (n ? 'Құрметті ' + n + '! ' : '') + 'Тансыккожин Даулет Байжұмаұлының 70 жас мерей тойына шақырамыз 🎉\n' + url;
  wa.href = 'https://wa.me/?text=' + encodeURIComponent(text);
  if (window.QRCode) { qrEl.hidden = false; qrEl.innerHTML = ''; qr = new QRCode(qrEl, { text:url, width:180, height:180, correctLevel: QRCode.CorrectLevel.M }); }
}
nm.addEventListener('input', build); build();
document.getElementById('copy').addEventListener('click', () => {
  navigator.clipboard.writeText(out.textContent).then(() => { msg.textContent = 'Көшірілді ✓'; })
    .catch(() => { const r = document.createRange(); r.selectNodeContents(out); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.textContent = 'Белгіленді — Ctrl/Cmd + C басыңыз'; });
});
</script>
</body>
</html>
